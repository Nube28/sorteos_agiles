name: CI Monorepo (pnpm)

on:
  push:
    branches: ["main"]
    paths:
      - 'packages/**'
      - 'apps/**'
      - 'package.json'
      - 'pnpm-lock.yaml' # Importante: observar el lockfile de pnpm
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Instalar pnpm (Paso CLAVE)
      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9 # O la versión que uses (ej. 8)

      # 3. Configurar Node + Caché de pnpm
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm' # Esto acelera muchísimo las instalaciones futuras

      # 4. Instalar dependencias
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # 5. Ejecutar tareas (Ejemplo con filtro)
      # Esto ejecutará el script 'build' en todos los paquetes que lo tengan
      - name: Construir todo el monorepo
        run: pnpm -r run build
      
      # Opcional: Si quieres correr tests solo en una app específica
      # - name: Test Frontend
      #   run: pnpm --filter mi-app-frontend run test