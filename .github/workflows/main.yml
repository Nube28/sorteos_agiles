name: CI Monorepo (pnpm)

on:
  push:
    branches: ["main"]
    # Se eliminó 'paths' para asegurar que el Action corra SIEMPRE
    # que haya un cambio en la rama main.
  pull_request:
    branches: ["main"]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar código
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Instalar pnpm
      - name: Instalar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      # 3. Configurar Node + Caché de pnpm
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      # 4. Instalar dependencias
      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # 5. Construir todo el monorepo
      # Ejecuta el script 'build' en todos los paquetes del workspace
      - name: Construir todo el monorepo
        run: pnpm -r run build
      
      # Opcional: Si quieres correr tests
      # - name: Ejecutar Tests
      #   run: pnpm -r run test